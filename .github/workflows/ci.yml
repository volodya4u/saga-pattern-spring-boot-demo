name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

  # Runs the whole saga: all four packaged services against a real Kafka broker.
  # An order is approved when stock and payment succeed, rejected when stock is
  # short, and rejected with the reservation cancelled when payment fails.
  smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      kafka:
        image: apache/kafka:4.2.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Package
        run: mvn -B -ntp package -DskipTests

      # orders-service creates the command topics the other services consume,
      # so it starts first. A single broker, so topics get one replica.
      - name: Start services
        run: |
          kafka='--spring.kafka.bootstrap-servers=localhost:9092 --app.kafka.topic.replicas=1'
          start() {
            nohup java -jar "$1"/target/"$1"-1.0.0.jar $2 > "$1".log 2>&1 &
            echo $! > "$1".pid
          }
          wait_for() {
            timeout 120 bash -c "until [ \$(grep -c '$2' $1.log) -ge $3 ]; do sleep 2; done"
          }
          start credit-card-processor-service
          start orders-service "$kafka"
          wait_for orders-service 'Started OrdersServiceApplication' 1
          start products-service "$kafka"
          start payments-service "$kafka"
          wait_for credit-card-processor-service 'Started CreditCardProcessorApplication' 1
          wait_for orders-service 'partitions assigned' 2
          wait_for products-service 'partitions assigned' 1
          wait_for payments-service 'partitions assigned' 1

      - name: Create a product with 5 in stock
        run: |
          product_id=$(curl -sS --fail-with-body -H 'Content-Type: application/json' \
            -d '{"name":"Smoke test product","price":10.5,"quantity":5}' \
            http://localhost:8081/products | jq -r .id)
          echo "PRODUCT_ID=$product_id" >> "$GITHUB_ENV"
          echo "CUSTOMER_ID=$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_ENV"

      - name: Order 2, which is approved
        run: |
          order_id=$(./.github/scripts/place-order.sh 2)
          ./.github/scripts/await-order-history.sh "$order_id" '["APPROVED","CREATED"]'
          test "$(./.github/scripts/stock.sh)" -eq 3

      - name: Order 10, which is rejected for lack of stock
        run: |
          order_id=$(./.github/scripts/place-order.sh 10)
          ./.github/scripts/await-order-history.sh "$order_id" '["CREATED","REJECTED"]'
          test "$(./.github/scripts/stock.sh)" -eq 3

      - name: Order 1 with the card processor down, which is rejected and its stock returned
        run: |
          kill "$(cat credit-card-processor-service.pid)"
          order_id=$(./.github/scripts/place-order.sh 1)
          ./.github/scripts/await-order-history.sh "$order_id" '["CREATED","REJECTED"]'
          test "$(./.github/scripts/stock.sh)" -eq 3
          docker exec ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic products-commands --from-beginning \
            --timeout-ms 10000 --formatter-property print.headers=true > products-commands.txt || true
          grep "CancelProductReservationCommand" products-commands.txt | grep -q "$order_id"

      - name: Show service logs
        if: always()
        run: |
          for service in orders-service products-service payments-service credit-card-processor-service; do
            echo "::group::$service"
            cat "$service.log" || true
            echo "::endgroup::"
          done

  # Merge Dependabot's patch and minor updates once build-and-test and the saga
  # smoke test have passed. Docker image updates and minor Spring Boot parent
  # updates are left for review.
  dependabot-auto-merge:
    needs: [build-and-test, smoke-test]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge patch and minor updates
        if: >-
          steps.meta.outputs.package-ecosystem != 'docker' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
            !contains(steps.meta.outputs.dependency-names, 'spring-boot-starter-parent')))
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
